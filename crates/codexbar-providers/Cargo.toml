[package]
name = "codexbar-providers"
description = "CodexBar provider adapters: credentials, HTTP fetch and response parsing"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
codexbar-core.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde.workspace = true
ureq.workspace = true
sha2.workspace = true
getrandom = "0.3"
form_urlencoded = "1"
unicode-normalization = "0.1.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows.workspace = true

# The command runner's console fixtures (chief#43) detach from and inspect their console.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_Console"] }

[lints]
workspace = true

[[test]]
name = "command_runner"
harness = false
