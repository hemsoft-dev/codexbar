[package]
name = "codexbar-store"
description = "CodexBar local persistence: bounded usage history"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
codexbar-core.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[target.'cfg(not(windows))'.dependencies]
keyring-core = "1.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[lints]
workspace = true
