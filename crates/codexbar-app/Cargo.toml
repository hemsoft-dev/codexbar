[package]
name = "codexbar-app"
description = "CodexBar: GPUI dashboard and tray host"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "codexbar"
path = "src/main.rs"

[features]
# `CODEXBAR_CAPTURE_DIR=<folder> cargo run --features capture -p codexbar-app -- --demo` renders the running app's views
# to PNGs and quits (src/self_capture.rs), for screenshots where no screen-capture tool may run.
capture = ["gpui-kit/test-support"]

[dependencies]
sha2.workspace = true
codexbar-core.workspace = true
codexbar-providers.workspace = true
codexbar-store.workspace = true
tray-icon.workspace = true
raw-window-handle.workspace = true
anyhow.workspace = true
gpui-kit.workspace = true
chrono.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-core.workspace = true
windows-collections.workspace = true
windows-future.workspace = true

# The Mac build compiles GPUI's Metal shaders at startup instead of with Xcode's `metal` tool, so the Command Line Tools
# are enough to build it. The version follows gpui-kit's own pin.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Asks the session bus whether a notification service is there (#161).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["runtime_shaders"] }

[dev-dependencies]
# Headless UI integration tests: real views in in-process windows, no desktop input or focus changes.
gpui-kit = { workspace = true, features = ["test-support"] }
serde_json.workspace = true

[lints]
workspace = true
