name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same pull request cancels the superseded run; pushes to main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-scan:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run secret and Miasma scans
        shell: pwsh
        run: ./scripts/Invoke-SecurityScan.ps1

      - name: Install Rust advisory scanner
        shell: pwsh
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content scripts/rust-audit-version.txt -Raw).Trim()
          cargo install cargo-audit --version $version --locked --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Scan locked Rust dependencies
        shell: pwsh
        run: ./scripts/Invoke-RustAdvisoryScan.ps1

      - name: Verify Rust advisory rejection
        shell: pwsh
        run: ./scripts/tests/RustAdvisoryScan.Tests.ps1

      - name: Upload security scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: artifacts/security/
          retention-days: 14

      - name: Upload Gitleaks SARIF
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/security/gitleaks.sarif
          category: gitleaks

  rust:
    # The same gates on every platform CodexBar runs on (#161).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # GPUI's X11 and Wayland backends link these; the tray icon and the keyring speak D-Bus in pure Rust.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype-dev libxcb1-dev libx11-xcb-dev

      # rust-toolchain.toml pins stable with rustfmt and clippy; rustup installs it on first use.
      - name: Install Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Includes the headless UI integration tests (in-process gpui test windows; no desktop needed).
      - name: Test
        run: cargo test --workspace --locked

  rust-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype-dev libxcb1-dev libx11-xcb-dev

      - name: Install pinned Rust metrics tools
        run: python3 scripts/rust-metrics.py install

      - name: Test production scope and regression gate
        run: python3 scripts/tests/test_rust_metrics.py

      - name: Measure base and candidate, then gate regressions
        env:
          METRICS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/rust-metrics.py ci --base "$METRICS_BASE"

      - name: Publish Rust metrics summary
        if: always()
        run: |
          if test -f artifacts/rust-metrics/candidate/summary.md; then
            cat artifacts/rust-metrics/candidate/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f artifacts/rust-metrics/gate.json; then
            cat artifacts/rust-metrics/gate.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-metrics
          path: artifacts/rust-metrics/
          retention-days: 14

  rust-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: Swatinem/rust-cache@v2

      - name: Install pinned Rust mutation tool
        run: python3 scripts/rust-mutations.py install

      - name: Prove weakened assertions fail qualification
        run: python3 scripts/tests/test_rust_mutations.py

      - name: Qualify domain, provider and persistence assertions
        run: python3 scripts/rust-mutations.py run

      - name: Publish Rust mutation summary
        if: always()
        run: |
          if test -f artifacts/rust-mutations/summary.md; then
            cat artifacts/rust-mutations/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-mutations
          path: artifacts/rust-mutations/
          retention-days: 14

  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install markdownlint-cli
        run: npm ci --ignore-scripts

      - name: Audit all npm dependencies, including development tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/npm-audit | Out-Null
          npm run --silent audit:npm -- --json | Set-Content artifacts/npm-audit/report.json
          $auditExit = $LASTEXITCODE
          Get-Content artifacts/npm-audit/report.json
          exit $auditExit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit
          path: artifacts/npm-audit/
          retention-days: 14

      - name: Prove npm advisory policy rejects vulnerable locks
        run: npm run test:npm-audit

      - name: Markdown Lint
        run: npm run lint:md

      - name: Copilot Metrics PowerShell Tests
        shell: pwsh
        run: ./scripts/tests/CopilotMetrics.Core.Tests.ps1

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --verbosity minimal

      - name: Format Check
        run: dotnet format --verify-no-changes --verbosity minimal

      - name: Test
        run: dotnet test --no-build --verbosity minimal

      - name: Restore Tools
        run: dotnet tool restore

      - name: Mutation Testing (Core)
        working-directory: src/CodexBar.Core.Tests
        run: dotnet stryker --verbosity warning

      - name: Upload Mutation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: src/CodexBar.Core.Tests/StrykerOutput/**/reports/
          retention-days: 14

      - name: Security Audit
        shell: pwsh
        run: |
          $json = dotnet list package --vulnerable --include-transitive --format json
          $report = $json | ConvertFrom-Json
          $hasVulnerabilities = $false

          foreach ($project in @($report.projects)) {
            if (-not $project.frameworks) { continue }
            foreach ($framework in @($project.frameworks)) {
              $packages = @($framework.topLevelPackages) + @($framework.transitivePackages)
              foreach ($package in @($packages)) {
                if ($package -and @($package.vulnerabilities).Count -gt 0) {
                  $hasVulnerabilities = $true
                }
              }
            }
          }

          if ($hasVulnerabilities) {
            Write-Error "Vulnerable packages detected!"
            exit 1
          }
