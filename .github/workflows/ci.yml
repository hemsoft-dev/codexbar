name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same pull request cancels the superseded run; pushes to main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-scan:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run secret and Miasma scans
        shell: pwsh
        run: ./scripts/Invoke-SecurityScan.ps1

      - name: Upload security scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: artifacts/security/
          retention-days: 14

      - name: Upload Gitleaks SARIF
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/security/gitleaks.sarif
          category: gitleaks

  rust:
    # The same gates on every platform CodexBar runs on (#161).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # GPUI's X11 and Wayland backends link these; the tray icon and the keyring speak D-Bus in pure Rust.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype-dev libxcb1-dev libx11-xcb-dev

      # rust-toolchain.toml pins stable with rustfmt and clippy; rustup installs it on first use.
      - name: Install Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Includes the headless UI integration tests (in-process gpui test windows; no desktop needed).
      - name: Test
        run: cargo test --workspace --locked

  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install markdownlint-cli
        run: npm ci

      - name: Markdown Lint
        run: npm run lint:md

      - name: Copilot Metrics PowerShell Tests
        shell: pwsh
        run: ./scripts/tests/CopilotMetrics.Core.Tests.ps1

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --verbosity minimal

      - name: Format Check
        run: dotnet format --verify-no-changes --verbosity minimal

      - name: Test
        run: dotnet test --no-build --verbosity minimal

      - name: Restore Tools
        run: dotnet tool restore

      - name: Mutation Testing (Core)
        working-directory: src/CodexBar.Core.Tests
        run: dotnet stryker --verbosity warning

      - name: Upload Mutation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: src/CodexBar.Core.Tests/StrykerOutput/**/reports/
          retention-days: 14

      - name: Security Audit
        shell: pwsh
        run: |
          $json = dotnet list package --vulnerable --include-transitive --format json
          $report = $json | ConvertFrom-Json
          $hasVulnerabilities = $false

          foreach ($project in @($report.projects)) {
            if (-not $project.frameworks) { continue }
            foreach ($framework in @($project.frameworks)) {
              $packages = @($framework.topLevelPackages) + @($framework.transitivePackages)
              foreach ($package in @($packages)) {
                if ($package -and @($package.vulnerabilities).Count -gt 0) {
                  $hasVulnerabilities = $true
                }
              }
            }
          }

          if ($hasVulnerabilities) {
            Write-Error "Vulnerable packages detected!"
            exit 1
          }
