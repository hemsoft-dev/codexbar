name: Console window probe

# Throwaway Windows-native evidence for chief#43 / codexbar#271 (never merged): runs the real CodexBar build of
# BASE_REF (and FIX_REF when set) through background Copilot refreshes that start `gh`, and records every console
# and window that appears. Lives only on the probe branch.
on:
  push:
    branches: [probe/console-windows-native]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base commit (current main)
        default: bd1bab8916a812323f8cfe078365538b020c6cc1
      fix_ref:
        description: Candidate commit (empty for base only)
        default: ''

permissions:
  contents: read

env:
  BASE_REF: ${{ inputs.base_ref || 'bd1bab8916a812323f8cfe078365538b020c6cc1' }}
  FIX_REF: ${{ inputs.fix_ref || '' }}
  # PR #270 rebased on bd1bab8.
  METRICS_REF: c79f0c3c3cf5aaf7778038325385c69cfcfc0c9e

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: probe

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_REF }}
          path: base

      - uses: actions/checkout@v4
        if: env.FIX_REF != ''
        with:
          ref: ${{ env.FIX_REF }}
          path: fix

      - name: Install Rust toolchain
        shell: bash
        working-directory: base
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: base -> target

      - name: Build base
        working-directory: base
        run: cargo build --release -p codexbar-app --locked

      # The same source without CREATE_NO_WINDOW for background CLIs: what a CodexBar-started gh flash looks like.
      - name: Build a regressed control
        shell: bash
        working-directory: base
        run: |
          cp target/release/codexbar.exe ../codexbar-base.exe
          sed -i 's/let window = if console { CREATE_NEW_CONSOLE } else { CREATE_NO_WINDOW };/let window = if console { CREATE_NEW_CONSOLE } else { 0 };/' crates/codexbar-providers/src/contained.rs
          git diff --exit-code --quiet && { echo "control patch did not apply"; exit 1; }
          git diff
          cargo build --release -p codexbar-app --locked
          cp target/release/codexbar.exe ../codexbar-regressed.exe
          git checkout -- crates/codexbar-providers/src/contained.rs

      - name: Build candidate
        if: env.FIX_REF != ''
        working-directory: fix
        run: cargo build --release -p codexbar-app --locked

      # The Antigravity CLI CodexBar reads Gemini coding quotas with; not signed in on the runner.
      - name: Install the Antigravity CLI
        continue-on-error: true
        shell: powershell
        run: |
          irm https://antigravity.google/cli/install.ps1 | iex
          $agy = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter agy.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($agy) { $agy.DirectoryName | Add-Content $env:GITHUB_PATH; & $agy.FullName --version } else { Write-Host 'agy.exe not found' }

      - name: Record the desktop and enable process auditing
        shell: powershell
        run: |
          auditpol /set /subcategory:"Process Creation" /success:enable
          reg add HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\System\Audit /v ProcessCreationIncludeCmdLine_Enabled /t REG_DWORD /d 1 /f
          New-Item -ItemType Directory -Force probe-out | Out-Null
          [ordered]@{
            os = (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber)
            session = (Get-Process -Id $PID).SessionId
            user = "$env:USERDOMAIN\$env:USERNAME"
            windowsTerminal = @(Get-AppxPackage -Name Microsoft.WindowsTerminal* -ErrorAction SilentlyContinue | ForEach-Object { $_.PackageFullName })
            delegation = (Get-ItemProperty 'HKCU:\Console\%%Startup' -ErrorAction SilentlyContinue | Select-Object DelegationConsole, DelegationTerminal)
            gh = (Get-Command gh).Source
            ghVersion = ((& gh --version) -join ' ')
            agy = (Get-Command agy -ErrorAction SilentlyContinue).Source
            started = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json -Depth 4 | Tee-Object probe-out/environment.json
          [DateTime]::UtcNow.ToString('o') | Set-Content probe-out/since.txt

      - name: Probe the regressed control
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./probe/.github/console-probe/Invoke-ConsoleProbe.ps1 -Exe codexbar-regressed.exe -Label regressed -OutDir probe-out -AppSeconds 150

      - name: Probe base
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./probe/.github/console-probe/Invoke-ConsoleProbe.ps1 -Exe codexbar-base.exe -Label base -OutDir probe-out -Matrix

      - name: Probe candidate
        if: env.FIX_REF != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./probe/.github/console-probe/Invoke-ConsoleProbe.ps1 -Exe fix/target/release/codexbar.exe -Label fix -OutDir probe-out

      - name: Process creations
        if: always()
        shell: powershell
        run: ./probe/.github/console-probe/Get-ProcessAudit.ps1 -Since ([datetime](Get-Content probe-out/since.txt)) -OutFile probe-out/processes.json

      - name: Summarize
        if: always()
        shell: bash
        run: python -I probe/.github/console-probe/summarize.py probe-out | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-probe-${{ github.run_id }}
          path: probe-out/
          retention-days: 30

  metrics-task:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: probe

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.METRICS_REF }}
          path: metrics

      - name: Probe the original and prepared metrics tasks
        shell: powershell
        run: ./probe/.github/console-probe/Invoke-MetricsTaskProbe.ps1 -Root metrics -OutDir probe-out

      - name: Summarize
        if: always()
        shell: bash
        run: python -I probe/.github/console-probe/summarize.py probe-out | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-task-probe-${{ github.run_id }}
          path: probe-out/
          retention-days: 30
