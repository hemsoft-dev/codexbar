name: Package

# Builds the MSIX package and runs the release procedures on a clean runner: install from the App Installer file,
# the app's own update check, the widget provider's COM activation (#94), upgrade, rollback and uninstall (#93).
# Also builds the macOS app and DMG and the Linux .deb, installs the .deb, and keeps both as artifacts (#167).
on:
  pull_request:
    branches: [main, feat/rust-gpui-dashboard]
    paths:
      - package.ps1
      - package-macos.sh
      - package-linux.sh
      - crates/codexbar-app/examples/**
      - Cargo.toml
      - Cargo.lock
      - crates/*/Cargo.toml
      - packaging/**
      - scripts/Test-MsixChannel.ps1
      - crates/codexbar-app/src/package.rs
      - crates/codexbar-app/src/main.rs
      - crates/codexbar-app/src/widgets/**
      - .github/workflows/package.yml
  workflow_dispatch:

concurrency:
  group: package-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install, update, roll back and uninstall
        shell: pwsh
        run: ./scripts/Test-MsixChannel.ps1 -InformationAction Continue

  macos-app:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CodexBar.app and the DMG
        run: OUT=dist ./package-macos.sh

      - name: Check the bundle
        run: |
          codesign --verify --strict dist/CodexBar.app
          plutil -lint dist/CodexBar.app/Contents/Info.plist
          test "$(defaults read "$PWD/dist/CodexBar.app/Contents/Info" LSUIElement)" = 1
          hdiutil verify dist/CodexBar-*.dmg

      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: codexbar-macos
          path: dist/CodexBar-*.dmg
          retention-days: 14

  linux-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype-dev libxcb1-dev libx11-xcb-dev \
            desktop-file-utils

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the .deb
        run: OUT=dist ./package-linux.sh

      - name: Install it and check what it put where
        run: |
          sudo apt-get install -y ./dist/codexbar_*.deb
          command -v codexbar
          desktop-file-validate /usr/share/applications/HemSoft.CodexBar.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/HemSoft.CodexBar.png

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: codexbar-linux
          path: dist/codexbar_*.deb
          retention-days: 14
