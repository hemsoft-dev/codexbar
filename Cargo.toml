[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
codexbar-core = { path = "crates/codexbar-core" }
codexbar-providers = { path = "crates/codexbar-providers" }
codexbar-store = { path = "crates/codexbar-store" }
gpui-kit = "0.8.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ureq = "3.4"
# On Linux the KSNI backend speaks StatusNotifierItem over D-Bus itself: no GTK main loop, no appindicator library.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
raw-window-handle = "0.6"
anyhow = "1"
sha2 = "0.10"
# The generated Windows App SDK Widgets bindings (#94) use these crates directly, at the versions `windows` uses.
windows-core = "0.62"
windows-collections = "0.3"
windows-future = "0.3"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_Globalization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Recovery", "Win32_System_WinRT", "Win32_System_Com", "Foundation", "Storage_Streams", "ApplicationModel", "ApplicationModel_Activation", "Management_Deployment", "Data_Xml_Dom", "UI_Notifications"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
